name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Build
        run: |
          ls
          ZIP=$(ls *.zip | head -n 1)
          if [ -n "$ZIP" ]; then unzip -o "$ZIP"; fi
          ls
          if [ -f gradlew ]; then chmod +x gradlew && ./gradlew assembleDebug --stacktrace; else gradle assembleDebug --stacktrace; fi
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bondhu-ai-apk
          path: "**/app-debug.apk"
