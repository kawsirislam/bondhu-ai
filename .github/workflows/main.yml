name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Build
        run: |
          ls
          ZIP=$(ls *.zip | head -n 1)
          if [ -n "$ZIP" ]; then unzip -o "$ZIP"; fi
          ls
          FILE=$(find . -name "BondhuWebViewBridge.kt" | head -n 1)
          echo "Fixing file: $FILE"
          if [ -n "$FILE" ]; then sed -i 's/onBackPressedDispatcher/(context as androidx.activity.ComponentActivity).onBackPressedDispatcher/g' "$FILE"; fi
          echo "--- TOP 1-30 ---"
          cat -n "$FILE" | sed -n '1,30p'
          echo "--- LINE 200-220 ---"
          cat -n "$FILE" | sed -n '200,220p'
          if [ -f gradlew ]; then chmod +x gradlew && ./gradlew assembleDebug --stacktrace; else gradle assembleDebug --stacktrace; fi
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bondhu-ai-apk
          path: "**/app-debug.apk"
