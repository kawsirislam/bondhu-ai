name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build
        run: |
          ls
          ZIP=$(ls *.zip | head -n 1)
          if [ -n "$ZIP" ]; then unzip -o "$ZIP"; fi
          DIR=$(find . -name gradlew | head -n 1 | xargs dirname)
          echo "Gradlew in $DIR"
          cd "$DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bondhu-ai-apk
          path: "**/app-debug.apk"
