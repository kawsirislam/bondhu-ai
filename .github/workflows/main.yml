name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Build
        run: |
          ls
          ZIP=$(ls *.zip | head -n 1)
          if [ -n "$ZIP" ]; then unzip -o "$ZIP"; fi
          FILE=$(find . -name "BondhuWebViewBridge.kt" | head -n 1)
          echo "Fixing file: $FILE"
          if [ -n "$FILE" ]; then sed -i 's/activity\.onBackPressedDispatcher/(activity as androidx.activity.ComponentActivity).onBackPressedDispatcher/g' "$FILE"; fi
          echo "--- LINE 200-220 ---"
          cat -n "$FILE" | sed -n '200,220p'
          set -o pipefail
          if [ -f gradlew ]; then chmod +x gradlew && ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log; else gradle assembleDebug --stacktrace 2>&1 | tee build.log; fi
          echo "========== ASOL VUL EKHANE =========="
          grep -i "^e:" build.log || echo "No e: line found"
          grep -i "Unresolved\|error:" build.log | head -n 20 || true
          echo "========== SES =========="
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bondhu-ai-apk
          path: "**/app-debug.apk"
