name: Build Debug APK
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip Project
        run: |
          unzip -o "bondhu-ai-android-studio (1).zip" -d project
          ls -R project/android-studio-project

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > project/android-studio-project/local.properties
          cat project/android-studio-project/local.properties

      - name: Build Debug APK
        run: |
          cd project/android-studio-project
          gradle assembleDebug --stacktrace --info

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bondhu-AI-APK
          path: project/android-studio-project/app/build/outputs/apk/debug/app-debug.apk
