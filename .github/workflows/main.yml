name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Unzip project
        run: |
          ls -la
          unzip -o *.zip
          ls -la
          if [ -d "bondhu-ai-android"* ]; then cd bondhu-ai-android*/* 2>/dev/null || cd bondhu-ai-android*/; fi
          find . -maxdepth 3 -name "gradlew" | head
      - name: Build APK
        run: |
          APP_DIR=$(find . -name "gradlew" -exec dirname {} \; | head -n 1)
          echo "APP_DIR=$APP_DIR"
          cd "$APP_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bondhu-ai-apk
          path: "**/app/build/outputs/apk/debug/*.apk"
